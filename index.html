<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workshop Maintenance • Machine Repair Estimation & Presets</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
  <style>
    @media print {
      body * { visibility: hidden; }
      #printable-approval-sheet, #printable-approval-sheet * { visibility: visible; }
      #printable-approval-sheet {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        background: white !important;
        color: black !important;
        padding: 20px;
      }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased">
  <div id="boot-error" class="hidden max-w-2xl mx-auto mt-10 p-4 bg-rose-950 border border-rose-700 text-rose-200 rounded-xl text-sm font-mono"></div>
  <div id="root"></div>

  <script>
    window.onerror = function (msg, url, line) {
      const box = document.getElementById('boot-error');
      if (box) {
        box.classList.remove('hidden');
        box.textContent = 'Error: ' + msg + ' (Line ' + line + ')';
      }
    };

    (function () {
      const { useState, useEffect, useMemo, createElement: h } = React;

      // ==========================================
      // 1. IndexedDB Persistence (Survives Reloads)
      // ==========================================
      const DB_NAME = 'WorkshopMachinePresetsDB_v1';
      const STORE_NAME = 'workspace';

      function openDB() {
        return new Promise((resolve, reject) => {
          const req = indexedDB.open(DB_NAME, 1);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME);
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      }

      async function dbSet(key, val) {
        try {
          const db = await openDB();
          await new Promise((resolve, reject) => {
            const tx = db.transaction(STORE_NAME, 'readwrite');
            tx.objectStore(STORE_NAME).put(val, key);
            tx.oncomplete = () => resolve();
            tx.onerror = () => reject(tx.error);
          });
        } catch (_) {}
      }

      async function dbGet(key) {
        try {
          const db = await openDB();
          return await new Promise((resolve, reject) => {
            const tx = db.transaction(STORE_NAME, 'readonly');
            const req = tx.objectStore(STORE_NAME).get(key);
            req.onsuccess = () => resolve(req.result ?? null);
            req.onerror = () => reject(req.error);
          });
        } catch (_) {
          return null;
        }
      }

      // ==========================================
      // 2. C6 Machine Seed Catalog & Presets
      // ==========================================
      const CATEGORIES = [
        'Preventive Maintenance',
        'Corrective Maintenance',
        'Property Damage',
        'Modification'
      ];

      const DEFAULT_CATALOG = {
        C6: {
          parts: [
            { id: 'c6-1', name: 'Sliding Bearing (Mast Assembly)', code: 'C6-SLB-01', category: 'Preventive Maintenance', defaultQty: 4, unitPrice: 70.00 },
            { id: 'c6-2', name: 'Mast Chain (SLH Heavy Duty)', code: 'C6-MCH-02', category: 'Preventive Maintenance', defaultQty: 2, unitPrice: 350.00 },
            { id: 'c6-3', name: 'Hydraulic Oil Seal Kit (TE 70x90x10)', code: 'C6-SLK-03', category: 'Preventive Maintenance', defaultQty: 2, unitPrice: 38.00 },
            { id: 'c6-4', name: 'Return Filter & O-Ring Service Set', code: 'C6-FLT-04', category: 'Preventive Maintenance', defaultQty: 1, unitPrice: 145.00 },
            { id: 'c6-5', name: 'Rotary Head Bearing & Octagon Shaft', code: 'C6-ROT-05', category: 'Corrective Maintenance', defaultQty: 1, unitPrice: 1850.00 },
            { id: 'c6-6', name: 'Wire Rope Winch Cable (26mm)', code: 'C6-WRP-06', category: 'Corrective Maintenance', defaultQty: 2, unitPrice: 480.00 },
            { id: 'c6-7', name: 'T20 EP Rotary Compression Spring', code: 'C6-SPR-07', category: 'Corrective Maintenance', defaultQty: 4, unitPrice: 95.00 },
            { id: 'c6-8', name: 'Remote Control Transmitter Housing', code: 'C6-RMT-08', category: 'Property Damage', defaultQty: 1, unitPrice: 752.00 },
            { id: 'c6-9', name: 'Hydraulic Hose Guard & Clamp Bracket', code: 'C6-HGD-09', category: 'Property Damage', defaultQty: 3, unitPrice: 120.00 },
            { id: 'c6-10', name: 'Preventer Jaw Clamp (Hardened 4140)', code: 'C6-PRV-10', category: 'Modification', defaultQty: 2, unitPrice: 410.00 },
            { id: 'c6-11', name: 'Auxiliary Sensor Wiring Harness Mod', code: 'C6-MOD-11', category: 'Modification', defaultQty: 1, unitPrice: 320.00 }
          ],
          presets: [
            {
              code: 'C6 P1',
              title: 'Standard Mast & Seal Service',
              category: 'Preventive Maintenance',
              partIds: ['c6-1', 'c6-2', 'c6-3', 'c6-4'] // 4 items -> C6 P1 (4)
            },
            {
              code: 'C6 P2',
              title: 'Rotary & Winch Overhaul',
              category: 'Corrective Maintenance',
              partIds: ['c6-5', 'c6-6', 'c6-7', 'c6-1'] // 4 items -> C6 P2 (4)
            },
            {
              code: 'C6 P3',
              title: 'Full Yard Re-Mobilisation Package',
              category: 'Modification',
              partIds: ['c6-1', 'c6-2', 'c6-3', 'c6-5', 'c6-6', 'c6-10', 'c6-11'] // 7 items -> C6 P3 (7)
            }
          ]
        }
      };

      // ==========================================
      // 3. Main Application
      // ==========================================
      function App() {
        const [isHydrated, setIsHydrated] = useState(false);
        const [catalog, setCatalog] = useState(DEFAULT_CATALOG);
        const [selectedMachine, setSelectedMachine] = useState('C6');
        const [activeCategory, setActiveCategory] = useState('ALL');
        const [estNumber, setEstNumber] = useState('EST-2026-001');
        const [rows, setRows] = useState([
          { rowId: 1, partId: 'c6-1', category: 'Preventive Maintenance', customName: '', qty: 4, unitPrice: 70.00 },
          { rowId: 2, partId: 'c6-2', category: 'Preventive Maintenance', customName: '', qty: 2, unitPrice: 350.00 },
          { rowId: 3, partId: '', category: 'Corrective Maintenance', customName: '', qty: 1, unitPrice: 0 }
        ]);
        const [uploadedFiles, setUploadedFiles] = useState([]);
        const [toast, setToast] = useState('');

        // New Preset Creator state
        const [newPresetCode, setNewPresetCode] = useState('');
        const [newPresetCategory, setNewPresetCategory] = useState('Preventive Maintenance');

        const triggerToast = (msg) => {
          setToast(msg);
          setTimeout(() => setToast(''), 3200);
        };

        // Load saved state on refresh
        useEffect(() => {
          (async () => {
            const saved = await dbGet('preset_workspace_v1');
            if (saved) {
              if (saved.catalog) setCatalog(saved.catalog);
              if (saved.selectedMachine) setSelectedMachine(saved.selectedMachine);
              if (saved.estNumber) setEstNumber(saved.estNumber);
              if (Array.isArray(saved.rows)) setRows(saved.rows);
              if (Array.isArray(saved.uploadedFiles)) setUploadedFiles(saved.uploadedFiles);
            }
            setIsHydrated(true);
          })();
        }, []);

        // Save state automatically on change
        useEffect(() => {
          if (!isHydrated) return;
          dbSet('preset_workspace_v1', { catalog, selectedMachine, estNumber, rows, uploadedFiles });
        }, [isHydrated, catalog, selectedMachine, estNumber, rows, uploadedFiles]);

        const machineNames = useMemo(() => Object.keys(catalog), [catalog]);
        const currentMachineData = catalog[selectedMachine] || { parts: [], presets: [] };

        // Filter available dropdown parts by selected category if active
        const dropdownParts = useMemo(() => {
          if (activeCategory === 'ALL') return currentMachineData.parts;
          return currentMachineData.parts.filter((p) => p.category === activeCategory);
        }, [currentMachineData, activeCategory]);

        // Handle machine dropdown change
        const handleSelectMachine = (machine) => {
          setSelectedMachine(machine);
          setActiveCategory('ALL');
          setRows([
            { rowId: 1, partId: '', category: 'Preventive Maintenance', customName: '', qty: 1, unitPrice: 0 },
            { rowId: 2, partId: '', category: 'Corrective Maintenance', customName: '', qty: 1, unitPrice: 0 }
          ]);
        };

        // Handle Row Part Dropdown Change
        const handleRowPartChange = (rowId, partId) => {
          const found = currentMachineData.parts.find((p) => p.id === partId);
          setRows((prev) =>
            prev.map((r) => {
              if (r.rowId !== rowId) return r;
              if (!found) return { ...r, partId: '', unitPrice: 0 };
              return {
                ...r,
                partId: found.id,
                category: found.category,
                qty: found.defaultQty || 1,
                unitPrice: found.unitPrice || 0
              };
            })
          );
        };

        const handleRowFieldChange = (rowId, field, value) => {
          setRows((prev) =>
            prev.map((r) => (r.rowId === rowId ? { ...r, [field]: value } : r))
          );
        };

        const handleAddRow = () => {
          const nextId = rows.length ? Math.max(...rows.map((r) => r.rowId)) + 1 : 1;
          setRows([
            ...rows,
            {
              rowId: nextId,
              partId: '',
              category: activeCategory === 'ALL' ? 'Preventive Maintenance' : activeCategory,
              customName: '',
              qty: 1,
              unitPrice: 0
            }
          ]);
        };

        const handleRemoveRow = (rowId) => {
          setRows((prev) => prev.filter((r) => r.rowId !== rowId));
        };

        // Apply Preset (e.g. C6 P1 (4), C6 P2 (4), C6 P3 (7))
        const handleApplyPreset = (preset) => {
          const populated = preset.partIds
            .map((pid, idx) => {
              const part = currentMachineData.parts.find((p) => p.id === pid);
              if (!part) return null;
              return {
                rowId: idx + 1,
                partId: part.id,
                category: part.category,
                customName: '',
                qty: part.defaultQty || 1,
                unitPrice: part.unitPrice || 0
              };
            })
            .filter(Boolean);

          if (populated.length > 0) {
            setRows(populated);
            triggerToast('Loaded preset ' + preset.code + ' (' + populated.length + ' items)');
          }
        };

        // Save current selected rows as a new custom Preset for this machine
        const handleSaveAsPreset = () => {
          const validPartIds = rows.map((r) => r.partId).filter(Boolean);
          if (!newPresetCode.trim() || validPartIds.length === 0) {
            triggerToast('Enter a preset name (e.g. ' + selectedMachine + ' P4) and select at least 1 part.');
            return;
          }
          const updatedCatalog = { ...catalog };
          updatedCatalog[selectedMachine] = {
            ...currentMachineData,
            presets: [
              ...currentMachineData.presets,
              {
                code: newPresetCode.trim(),
                title: newPresetCategory + ' Bundle',
                category: newPresetCategory,
                partIds: validPartIds
              }
            ]
          };
          setCatalog(updatedCatalog);
          setNewPresetCode('');
          triggerToast('Saved preset ' + newPresetCode.trim() + ' (' + validPartIds.length + ')');
        };

        // Learn machines & parts automatically from uploaded Excel trackers
        const handleExcelLearn = async (e) => {
          const files = Array.from(e.target.files || []);
          if (!files.length) return;

          const updatedCatalog = JSON.parse(JSON.stringify(catalog));
          const newFileList = [...uploadedFiles];

          for (const file of files) {
            const buf = await file.arrayBuffer();
            const wb = XLSX.read(buf, { type: 'array' });

            wb.SheetNames.forEach((sheetName) => {
              if (/summary/i.test(sheetName)) return;
              const sheet = wb.Sheets[sheetName];
              const matrix = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });

              let headerIdx = -1, descCol = -1, qtyCol = -1, unitCol = -1, totalCol = -1;
              for (let r = 0; r < matrix.length; r++) {
                const row = matrix[r];
                for (let c = 0; c < row.length; c++) {
                  const cell = String(row[c] || '').trim().toLowerCase();
                  if (/description|part|item|scope/.test(cell) && descCol === -1) { headerIdx = r; descCol = c; }
                  if (/reqd|qty|quantity/.test(cell) && qtyCol === -1) qtyCol = c;
                  if (/unit\s*rate|unit\s*price|each/.test(cell) && unitCol === -1) unitCol = c;
                  if (/total|amount/.test(cell) && !/unit/.test(cell) && totalCol === -1) totalCol = c;
                }
                if (headerIdx !== -1 && descCol !== -1 && (unitCol !== -1 || totalCol !== -1)) break;
              }

              if (headerIdx === -1 || descCol === -1) return;

              const machineKey = sheetName.trim();
              if (!updatedCatalog[machineKey]) {
                updatedCatalog[machineKey] = { parts: [], presets: [] };
              }

              const learnedParts = [];
              for (let r = headerIdx + 1; r < matrix.length; r++) {
                const row = matrix[r];
                const desc = String(row[descCol] || '').trim();
                if (!desc || /^(sub-?total|total|grand total)/i.test(desc)) continue;

                const rawQty = qtyCol !== -1 ? parseFloat(String(row[qtyCol]).replace(/[^0-9.]/g, '')) : 1;
                const qty = !isNaN(rawQty) && rawQty > 0 ? rawQty : 1;
                const rawUnit = unitCol !== -1 ? parseFloat(String(row[unitCol]).replace(/[^0-9.-]/g, '')) : NaN;
                const rawTot = totalCol !== -1 ? parseFloat(String(row[totalCol]).replace(/[^0-9.-]/g, '')) : NaN;

                const unitPrice = !isNaN(rawUnit) && rawUnit > 0 ? rawUnit : (!isNaN(rawTot) && rawTot > 0 ? rawTot / qty : 0);
                if (unitPrice <= 0) continue;

                const partObj = {
                  id: machineKey + '-p-' + r,
                  name: desc,
                  code: machineKey.toUpperCase().slice(0, 6) + '-' + r,
                  category: /mod|retrofit|upgrade/i.test(desc)
                    ? 'Modification'
                    : /damage|broken|bent|crack/i.test(desc)
                    ? 'Property Damage'
                    : /service|seal|filter|oil|bearing|chain/i.test(desc)
                    ? 'Preventive Maintenance'
                    : 'Corrective Maintenance',
                  defaultQty: qty,
                  unitPrice: Number(unitPrice.toFixed(2))
                };

                if (!updatedCatalog[machineKey].parts.some((p) => p.name === desc)) {
                  updatedCatalog[machineKey].parts.push(partObj);
                }
                learnedParts.push(partObj.id);
              }

              // Auto-generate P1 preset from imported sheet if none exists
              if (learnedParts.length > 0 && updatedCatalog[machineKey].presets.length === 0) {
                updatedCatalog[machineKey].presets.push({
                  code: machineKey + ' P1',
                  title: 'Imported Excel Standard Package',
                  category: 'Corrective Maintenance',
                  partIds: learnedParts.slice(0, 8)
                });
              }
            });

            newFileList.push(file.name);
          }

          setCatalog(updatedCatalog);
          setUploadedFiles(newFileList);
          triggerToast('Learned parts & presets from ' + files.length + ' Excel file(s).');
          e.target.value = '';
        };

        const grandTotal = useMemo(() => {
          return rows.reduce((sum, r) => sum + (Number(r.qty) || 0) * (Number(r.unitPrice) || 0), 0);
        }, [rows]);

        const categoryTotals = useMemo(() => {
          const map = {};
          CATEGORIES.forEach((c) => (map[c] = 0));
          rows.forEach((r) => {
            const amt = (Number(r.qty) || 0) * (Number(r.unitPrice) || 0);
            map[r.category] = (map[r.category] || 0) + amt;
          });
          return map;
        }, [rows]);

        const fmt = (n) => '$' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

        if (!isHydrated) return h('div', { className: 'p-8 text-slate-400' }, 'Loading saved workspace...');

        return h('div', { className: 'max-w-7xl mx-auto p-6 space-y-6' },
          toast && h('div', { className: 'fixed bottom-5 right-5 z-50 bg-emerald-600 text-white px-4 py-3 rounded-xl shadow-lg text-sm font-medium' }, toast),

          // Top Bar
          h('header', { className: 'flex flex-wrap items-center justify-between gap-4 bg-slate-900 border border-slate-800 p-5 rounded-2xl' },
            h('div', null,
              h('h1', { className: 'text-xl font-bold text-white' }, 'Machine Repair Estimation • Dropdown & Preset Builder'),
              h('p', { className: 'text-xs text-slate-400 mt-1' }, 'Select Machine → Choose Preset or Pick Row-by-Row Parts → Print Approval PDF')
            ),
            h('div', { className: 'flex flex-wrap items-center gap-2' },
              h('label', { className: 'cursor-pointer bg-amber-500 hover:bg-amber-400 text-slate-950 font-semibold px-4 py-2 rounded-xl text-sm transition' },
                '+ Import Excel Parts to Library',
                h('input', { type: 'file', multiple: true, accept: '.xlsx,.xls', onChange: handleExcelLearn, className: 'hidden' })
              ),
              h('button', {
                onClick: () => window.print(),
                className: 'bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-4 py-2 rounded-xl text-sm transition'
              }, 'Print / Save Approval PDF')
            )
          ),

          // Step 1 & Step 2: Machine Dropdown + Preset Chips (Matches your handwritten sketch)
          h('section', { className: 'grid grid-cols-1 lg:grid-cols-3 gap-4 bg-slate-900 border border-slate-800 p-5 rounded-2xl' },
            // 1. Machine Type Drop Down
            h('div', { className: 'space-y-2' },
              h('label', { className: 'block text-xs font-semibold uppercase tracking-wider text-amber-400' }, '1. Machine Type Drop Down'),
              h('select', {
                value: selectedMachine,
                onChange: (e) => handleSelectMachine(e.target.value),
                className: 'w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-sm font-semibold text-white focus:outline-none focus:border-amber-500'
              },
                machineNames.map((m) =>
                  h('option', { key: m, value: m }, m + ' (' + (catalog[m].parts.length) + ' parts)')
                )
              ),
              h('div', { className: 'pt-1' },
                h('label', { className: 'block text-xs text-slate-400 mb-1' }, 'Estimation Reference No.'),
                h('input', {
                  type: 'text',
                  value: estNumber,
                  onChange: (e) => setEstNumber(e.target.value),
                  className: 'w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-1.5 text-sm text-white'
                })
              )
            ),

            // 2. Machine Presets e.g. C6 P1 (4), C6 P2 (4), C6 P3 (7)
            h('div', { className: 'lg:col-span-2 space-y-2' },
              h('div', { className: 'flex items-center justify-between' },
                h('span', { className: 'text-xs font-semibold uppercase tracking-wider text-amber-400' },
                  '2. Quick Presets for ' + selectedMachine + ' (Click to Auto-Fill Rows)'
                ),
                h('span', { className: 'text-xs text-slate-400' }, '(No. of items in parts)')
              ),
              h('div', { className: 'flex flex-wrap gap-2.5 pt-1' },
                currentMachineData.presets.length === 0
                  ? h('span', { className: 'text-xs text-slate-500' }, 'No presets saved for this machine yet.')
                  : currentMachineData.presets.map((preset, idx) =>
                      h('button', {
                        key: idx,
                        onClick: () => handleApplyPreset(preset),
                        className: 'bg-slate-800 hover:bg-amber-500 hover:text-slate-950 border border-slate-700 px-4 py-2.5 rounded-xl text-left transition group'
                      },
                        h('div', { className: 'text-sm font-bold' }, preset.code + ' (' + preset.partIds.length + ')'),
                        h('div', { className: 'text-[11px] text-slate-400 group-hover:text-slate-900' }, preset.title)
                      )
                    )
              ),
              // Save current rows as new preset
              h('div', { className: 'flex flex-wrap items-center gap-2 pt-3 border-t border-slate-800/80' },
                h('input', {
                  type: 'text',
                  value: newPresetCode,
                  onChange: (e) => setNewPresetCode(e.target.value),
                  placeholder: 'New preset name (e.g. ' + selectedMachine + ' P4)',
                  className: 'bg-slate-950 border border-slate-700 rounded-lg px-3 py-1.5 text-xs w-48'
                }),
                h('select', {
                  value: newPresetCategory,
                  onChange: (e) => setNewPresetCategory(e.target.value),
                  className: 'bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs'
                }, CATEGORIES.map((c) => h('option', { key: c, value: c }, c))),
                h('button', {
                  onClick: handleSaveAsPreset,
                  className: 'bg-slate-800 hover:bg-slate-700 text-amber-400 border border-amber-500/30 px-3 py-1.5 rounded-lg text-xs font-semibold'
                }, '+ Save Current Rows as Preset')
              )
            )
          ),

          // Step 3: 4 Maintenance Categories Filter & Summary Strip
          h('section', { className: 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3' },
            h('button', {
              onClick: () => setActiveCategory('ALL'),
              className: 'p-3.5 rounded-2xl border text-left transition ' + (activeCategory === 'ALL' ? 'bg-amber-500/15 border-amber-500 text-white' : 'bg-slate-900 border-slate-800 text-slate-300')
            },
              h('div', { className: 'text-xs text-slate-400' }, 'All Categories'),
              h('div', { className: 'text-lg font-bold text-amber-400 mt-0.5' }, fmt(grandTotal))
            ),
            CATEGORIES.map((cat) =>
              h('button', {
                key: cat,
                onClick: () => setActiveCategory(cat),
                className: 'p-3.5 rounded-2xl border text-left transition ' + (activeCategory === cat ? 'bg-amber-500/15 border-amber-500 text-white' : 'bg-slate-900 border-slate-800 text-slate-300')
              },
                h('div', { className: 'text-xs font-medium truncate' }, cat),
                h('div', { className: 'text-lg font-bold mt-0.5' }, fmt(categoryTotals[cat] || 0))
              )
            )
          ),

          // Step 4: Row-by-Row Part Dropdown Builder (Printable Approval Sheet)
          h('section', { id: 'printable-approval-sheet', className: 'bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4' },
            // Header matching your printed sheet
            h('div', { className: 'flex flex-wrap justify-between gap-4 pb-4 border-b border-slate-800 text-xs' },
              h('div', null,
                h('div', { className: 'font-bold text-slate-300' }, 'Prepared & Verified By:'),
                h('div', { className: 'text-slate-400' }, 'Workshop Maintenance Team • Machine: ' + selectedMachine + ' • Ref: ' + estNumber)
              ),
              h('div', { className: 'text-right' },
                h('div', { className: 'font-bold text-slate-300' }, 'Approved By (Management / HOD):'),
                h('div', { className: 'text-slate-400 mt-1' }, 'Signature & Date: ________________________')
              )
            ),

            // Row-by-Row Part Dropdown Table
            h('div', { className: 'overflow-x-auto' },
              h('table', { className: 'w-full text-left text-sm' },
                h('thead', { className: 'bg-slate-950 text-slate-400 text-xs uppercase border-b border-slate-800' },
                  h('tr', null,
                    h('th', { className: 'px-3 py-2.5 w-16' }, 'Row'),
                    h('th', { className: 'px-3 py-2.5' }, selectedMachine + ' Part Drop Down'),
                    h('th', { className: 'px-3 py-2.5 w-48' }, 'Maintenance Category'),
                    h('th', { className: 'px-3 py-2.5 w-24 text-right' }, 'Possible Qty'),
                    h('th', { className: 'px-3 py-2.5 w-32 text-right' }, 'Unit Price'),
                    h('th', { className: 'px-3 py-2.5 w-32 text-right' }, 'Total Price'),
                    h('th', { className: 'px-3 py-2.5 w-12' }, '')
                  )
                ),
                h('tbody', { className: 'divide-y divide-slate-800/70' },
                  rows.map((row, idx) => {
                    const lineTotal = (Number(row.qty) || 0) * (Number(row.unitPrice) || 0);
                    return h('tr', { key: row.rowId },
                      h('td', { className: 'px-3 py-2.5 font-mono text-xs text-slate-400' }, 'Row ' + (idx + 1)),
                      h('td', { className: 'px-3 py-2.5' },
                        h('select', {
                          value: row.partId,
                          onChange: (e) => handleRowPartChange(row.rowId, e.target.value),
                          className: 'w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-sm text-white'
                        },
                          h('option', { value: '' }, '-- Select ' + selectedMachine + ' Row ' + (idx + 1) + ' Part --'),
                          dropdownParts.map((p) =>
                            h('option', { key: p.id, value: p.id }, p.name + ' (' + fmt(p.unitPrice) + ')')
                          )
                        )
                      ),
                      h('td', { className: 'px-3 py-2.5' },
                        h('select', {
                          value: row.category,
                          onChange: (e) => handleRowFieldChange(row.rowId, 'category', e.target.value),
                          className: 'w-full bg-slate-950 border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-slate-200'
                        }, CATEGORIES.map((c) => h('option', { key: c, value: c }, c)))
                      ),
                      h('td', { className: 'px-3 py-2.5 text-right' },
                        h('input', {
                          type: 'number',
                          min: 1,
                          value: row.qty,
                          onChange: (e) => handleRowFieldChange(row.rowId, 'qty', Number(e.target.value)),
                          className: 'w-20 bg-slate-950 border border-slate-700 rounded-lg px-2 py-1 text-right text-sm'
                        })
                      ),
                      h('td', { className: 'px-3 py-2.5 text-right' },
                        h('input', {
                          type: 'number',
                          step: '0.01',
                          value: row.unitPrice,
                          onChange: (e) => handleRowFieldChange(row.rowId, 'unitPrice', Number(e.target.value)),
                          className: 'w-28 bg-slate-950 border border-slate-700 rounded-lg px-2 py-1 text-right text-sm'
                        })
                      ),
                      h('td', { className: 'px-3 py-2.5 text-right font-semibold text-amber-400' }, fmt(lineTotal)),
                      h('td', { className: 'px-3 py-2.5 text-center' },
                        h('button', {
                          onClick: () => handleRemoveRow(row.rowId),
                          className: 'text-slate-500 hover:text-rose-400 text-xs font-bold px-2 py-1'
                        }, '✕')
                      )
                    );
                  })
                ),
                h('tfoot', { className: 'border-t border-slate-700 bg-slate-950/60' },
                  h('tr', null,
                    h('td', { colSpan: 5, className: 'px-3 py-3 text-right font-bold uppercase text-xs text-slate-300' },
                      'Total Estimated Repair Cost (' + selectedMachine + ')'
                    ),
                    h('td', { className: 'px-3 py-3 text-right font-bold text-base text-amber-400' }, fmt(grandTotal)),
                    h('td', null)
                  )
                )
              )
            ),

            h('div', { className: 'flex justify-between items-center pt-2' },
              h('button', {
                onClick: handleAddRow,
                className: 'bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-xl text-xs font-semibold'
              }, '+ Add Next Part Row (Row ' + (rows.length + 1) + ')'),
              h('span', { className: 'text-xs text-slate-400' },
                'All selections and learned Excel parts are saved automatically in your browser.'
              )
            )
          )
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(h(App));
    })();
  </script>
</body>
</html>
