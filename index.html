<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Electrical Dept • Repair Estimation & Cost Consolidation</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
  <style>
    @media print {
      body * { visibility: hidden; }
      #printable-approval-sheet, #printable-approval-sheet * { visibility: visible; }
      #printable-approval-sheet {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        background: white !important;
        color: black !important;
      }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased">
  <!-- Visible error fallback so the page never goes silently blank -->
  <div id="boot-error" class="hidden max-w-2xl mx-auto mt-10 p-4 bg-rose-950 border border-rose-700 text-rose-200 rounded-xl text-sm font-mono"></div>
  <div id="root"></div>

  <script>
    window.onerror = function (msg, url, line, col, err) {
      const box = document.getElementById('boot-error');
      if (box) {
        box.classList.remove('hidden');
        box.textContent = 'Startup Error: ' + msg + ' (Line ' + line + ')';
      }
    };

    (function () {
      if (!window.React || !window.ReactDOM || !window.XLSX) {
        const box = document.getElementById('boot-error');
        if (box) {
          box.classList.remove('hidden');
          box.textContent = 'CDN libraries failed to load. Check internet connection or corporate firewall blocking unpkg.com / cdn.sheetjs.com.';
        }
        return;
      }

      const { useState, useEffect, useMemo, createElement: h } = React;

      // ==========================================
      // 1. Safe IndexedDB + localStorage Fallback
      // ==========================================
      const DB_NAME = 'KellerRepairEstimationDB_v1';
      const STORE_NAME = 'workspace';

      function openDB() {
        return new Promise((resolve, reject) => {
          try {
            const req = indexedDB.open(DB_NAME, 1);
            req.onupgradeneeded = (e) => {
              const db = e.target.result;
              if (!db.objectStoreNames.contains(STORE_NAME)) {
                db.createObjectStore(STORE_NAME);
              }
            };
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
          } catch (err) {
            reject(err);
          }
        });
      }

      async function dbSet(key, val) {
        try {
          const db = await openDB();
          return await new Promise((resolve, reject) => {
            const tx = db.transaction(STORE_NAME, 'readwrite');
            tx.objectStore(STORE_NAME).put(val, key);
            tx.oncomplete = () => resolve();
            tx.onerror = () => reject(tx.error);
          });
        } catch (_) {
          try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
        }
      }

      async function dbGet(key) {
        try {
          const db = await openDB();
          return await new Promise((resolve, reject) => {
            const tx = db.transaction(STORE_NAME, 'readonly');
            const req = tx.objectStore(STORE_NAME).get(key);
            req.onsuccess = () => resolve(req.result ?? null);
            req.onerror = () => reject(req.error);
          });
        } catch (_) {
          try {
            const raw = localStorage.getItem(key);
            return raw ? JSON.parse(raw) : null;
          } catch (e) {
            return null;
          }
        }
      }

      async function dbClear() {
        try {
          const db = await openDB();
          await new Promise((resolve, reject) => {
            const tx = db.transaction(STORE_NAME, 'readwrite');
            tx.objectStore(STORE_NAME).clear();
            tx.oncomplete = () => resolve();
            tx.onerror = () => reject(tx.error);
          });
        } catch (_) {}
        try { localStorage.removeItem('state'); } catch (e) {}
      }

      // ==========================================
      // 2. Main Application Component
      // ==========================================
      function App() {
        const [isHydrated, setIsHydrated] = useState(false);
        const [partsData, setPartsData] = useState([]);
        const [uploadedFiles, setUploadedFiles] = useState([]);
        const [auditReports, setAuditReports] = useState([]);
        const [estimations, setEstimations] = useState([]);
        const [searchQuery, setSearchQuery] = useState('');
        const [viewMode, setViewMode] = useState('SUMMARY');
        const [toast, setToast] = useState('');

        const triggerToast = (msg) => {
          setToast(msg);
          setTimeout(() => setToast(''), 3500);
        };

        useEffect(() => {
          (async () => {
            try {
              const saved = await dbGet('state');
              if (saved) {
                if (Array.isArray(saved.partsData)) setPartsData(saved.partsData);
                if (Array.isArray(saved.uploadedFiles)) setUploadedFiles(saved.uploadedFiles);
                if (Array.isArray(saved.auditReports)) setAuditReports(saved.auditReports);
                if (Array.isArray(saved.estimations)) setEstimations(saved.estimations);
              }
            } catch (err) {
              console.error('Hydration error:', err);
            } finally {
              setIsHydrated(true);
            }
          })();
        }, []);

        useEffect(() => {
          if (!isHydrated) return;
          dbSet('state', {
            partsData,
            uploadedFiles,
            auditReports,
            estimations,
            updatedAt: new Date().toISOString()
          });
        }, [isHydrated, partsData, uploadedFiles, auditReports, estimations]);

        const parseMoney = (cell) => {
          if (!cell) return null;
          if (typeof cell.v === 'number' && !isNaN(cell.v)) {
            return { val: cell.v };
          }
          const rawStr = String(cell.w || cell.v || '').trim();
          if (!rawStr || rawStr === '-' || rawStr === '$-') return null;
          const cleaned = rawStr.replace(/[^0-9.-]+/g, '');
          const num = parseFloat(cleaned);
          return !isNaN(num) ? { val: num } : null;
        };

        const handleMultiExcelUpload = async (e) => {
          const files = Array.from(e.target.files || []);
          if (!files.length) return;

          let newParts = [...partsData];
          let newFiles = [...uploadedFiles];
          let newAudits = [...auditReports];

          for (const file of files) {
            const buffer = await file.arrayBuffer();
            const workbook = XLSX.read(buffer, { type: 'array', cellFormula: true, cellNF: true });

            const summaryTabName = workbook.SheetNames.find((name) =>
              /repair\s*(estimation\s*)?summary/i.test(name.trim())
            );

            let summaryEstTotal = 0;
            let summaryActTotal = 0;
            const summaryRows = [];

            if (summaryTabName) {
              const sheet = workbook.Sheets[summaryTabName];
              const range = XLSX.utils.decode_range(sheet['!ref'] || 'A1:A1');
              let headerRow = -1;
              let equipCol = -1, prodCol = -1, woCol = -1, estCol = -1, actCol = -1, statusCol = -1, linkCol = -1;

              for (let r = range.s.r; r <= Math.min(range.e.r, 15); r++) {
                for (let c = range.s.c; c <= range.e.c; c++) {
                  const cell = sheet[XLSX.utils.encode_cell({ r, c })];
                  const txt = String(cell && cell.v ? cell.v : '').trim().toLowerCase();
                  if (txt.includes('equipment')) { headerRow = r; equipCol = c; }
                  if (txt === 'product') prodCol = c;
                  if (txt.includes('work order')) woCol = c;
                  if (txt.includes('estimate price') || txt.includes('est. price')) estCol = c;
                  if (txt.includes('actual price') || txt.includes('actual spent')) actCol = c;
                  if ((txt.includes('stauts') || txt.includes('status')) && statusCol === -1) statusCol = c;
                  if (txt.includes('press link') || txt.includes('move forwards')) linkCol = c;
                }
                if (headerRow !== -1 && estCol !== -1) break;
              }

              const maxAllowedCol = linkCol !== -1 ? linkCol : range.e.c;
              let lastEquip = '', lastProd = '', lastWO = '';
              const seenSharedGroups = new Set();

              if (headerRow !== -1 && estCol !== -1) {
                for (let r = headerRow + 1; r <= range.e.r; r++) {
                  const rowTexts = [];
                  for (let c = 0; c <= maxAllowedCol; c++) {
                    const cellObj = sheet[XLSX.utils.encode_cell({ r, c })];
                    const v = String(cellObj && cellObj.v ? cellObj.v : '').trim();
                    if (v) rowTexts.push(v);
                  }
                  if (rowTexts.some((t) => /^total$/i.test(t))) break;

                  const getVal = (col) => {
                    if (col === -1) return '';
                    const cObj = sheet[XLSX.utils.encode_cell({ r, col })];
                    return String(cObj && cObj.v ? cObj.v : '').trim();
                  };

                  const equipVal = getVal(equipCol);
                  const prodVal = getVal(prodCol);
                  const woVal = getVal(woCol);
                  const statusVal = getVal(statusCol).toLowerCase();
                  const linkVal = getVal(linkCol);

                  if (equipVal) lastEquip = equipVal;
                  if (prodVal) lastProd = prodVal;
                  if (woVal) lastWO = woVal;

                  if (statusVal.includes('not required') || statusVal.includes('discussion')) continue;

                  const estParsed = parseMoney(sheet[XLSX.utils.encode_cell({ r, estCol })]);
                  const actParsed = actCol !== -1 ? parseMoney(sheet[XLSX.utils.encode_cell({ r, actCol })]) : null;

                  if (estParsed && estParsed.val > 0 && lastEquip) {
                    const cleanLink = linkVal.replace(/['!A1]/g, '').trim();
                    const sharedKey = lastWO + '|' + cleanLink + '|' + estParsed.val;
                    if (cleanLink && lastWO && seenSharedGroups.has(sharedKey)) continue;
                    if (cleanLink && lastWO) seenSharedGroups.add(sharedKey);

                    summaryEstTotal += estParsed.val;
                    summaryActTotal += actParsed ? actParsed.val : 0;

                    summaryRows.push({
                      id: file.name + '-SUM-' + r,
                      sourceFile: file.name,
                      isSummaryRow: true,
                      equipment: lastEquip,
                      product: lastProd || 'GENERAL',
                      description: lastEquip + ' (Master Approved Repair)',
                      qty: 1,
                      unitPrice: estParsed.val,
                      estTotal: estParsed.val,
                      actualSpent: actParsed ? actParsed.val : 0
                    });
                  }
                }
              }
            }

            let tabItemsTotal = 0;
            workbook.SheetNames.forEach((tabName) => {
              if (tabName === summaryTabName) return;
              const sheet = workbook.Sheets[tabName];
              const range = XLSX.utils.decode_range(sheet['!ref'] || 'A1:A1');

              let headerRow = -1, descCol = -1, qtyCol = -1, unitCol = -1, totalCol = -1;
              for (let r = range.s.r; r <= range.e.r; r++) {
                for (let c = range.s.c; c <= range.e.c; c++) {
                  const cObj = sheet[XLSX.utils.encode_cell({ r, c })];
                  const txt = String(cObj && cObj.v ? cObj.v : '').trim().toLowerCase();
                  if (/description|scope|part|item|details/.test(txt) && descCol === -1) { headerRow = r; descCol = c; }
                  if (/reqd|qty|quantity/.test(txt) && qtyCol === -1) qtyCol = c;
                  if (/unit\s*rate|unit\s*price|each/.test(txt) && unitCol === -1) unitCol = c;
                  if (/total|amount/.test(txt) && !/unit/.test(txt) && totalCol === -1) totalCol = c;
                }
                if (headerRow !== -1 && descCol !== -1 && (unitCol !== -1 || totalCol !== -1)) break;
              }

              if (headerRow === -1 || descCol === -1) return;

              for (let r = headerRow + 1; r <= range.e.r; r++) {
                const dObj = sheet[XLSX.utils.encode_cell({ r, descCol })];
                const desc = String(dObj && dObj.v ? dObj.v : '').trim();
                if (!desc || /^(sub-?total|total|grand total)/i.test(desc)) continue;

                const qObj = qtyCol !== -1 ? sheet[XLSX.utils.encode_cell({ r, qtyCol })] : null;
                const rawQty = qObj ? Number(qObj.v) : 1;
                const qty = !isNaN(rawQty) && rawQty > 0 ? rawQty : 1;
                const uObj = unitCol !== -1 ? parseMoney(sheet[XLSX.utils.encode_cell({ r, unitCol })]) : null;
                const tObj = totalCol !== -1 ? parseMoney(sheet[XLSX.utils.encode_cell({ r, totalCol })]) : null;

                const unitPrice = uObj ? uObj.val : (tObj ? tObj.val / qty : 0);
                const lineTotal = tObj ? tObj.val : unitPrice * qty;

                if (lineTotal > 0) {
                  tabItemsTotal += lineTotal;
                  newParts.push({
                    id: file.name + '-' + tabName + '-' + r,
                    sourceFile: file.name,
                    isSummaryRow: false,
                    equipment: tabName,
                    product: 'EQUIPMENT',
                    description: desc,
                    qty,
                    unitPrice,
                    estTotal: lineTotal,
                    actualSpent: 0
                  });
                }
              }
            });

            newParts = newParts.concat(summaryRows);
            newFiles.push({ name: file.name, size: file.size, uploadedAt: new Date().toISOString() });
            newAudits.push({
              fileName: file.name,
              summaryEst: summaryEstTotal,
              summaryAct: summaryActTotal,
              tabEst: tabItemsTotal
            });
          }

          setPartsData(newParts);
          setUploadedFiles(newFiles);
          setAuditReports(newAudits);
          triggerToast('Loaded ' + files.length + ' Excel file(s) & saved to browser storage.');
          e.target.value = '';
        };

        const handleClearAll = async () => {
          await dbClear();
          setPartsData([]);
          setUploadedFiles([]);
          setAuditReports([]);
          setEstimations([]);
          triggerToast('All sheets and saved browser storage cleared.');
        };

        const handleExportBackup = () => {
          const blob = new Blob(
            [JSON.stringify({ partsData, uploadedFiles, auditReports, estimations }, null, 2)],
            { type: 'application/json' }
          );
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'keller-repair-backup-' + new Date().toISOString().slice(0, 10) + '.json';
          a.click();
          URL.revokeObjectURL(url);
        };

        const handleImportBackup = async (e) => {
          const file = e.target.files && e.target.files[0];
          if (!file) return;
          const text = await file.text();
          const parsed = JSON.parse(text);
          if (parsed.partsData) setPartsData(parsed.partsData);
          if (parsed.uploadedFiles) setUploadedFiles(parsed.uploadedFiles);
          if (parsed.auditReports) setAuditReports(parsed.auditReports);
          if (parsed.estimations) setEstimations(parsed.estimations);
          triggerToast('Workspace restored from JSON backup.');
        };

        const filteredRows = useMemo(() => {
          return partsData.filter((item) => {
            if (viewMode === 'SUMMARY' && !item.isSummaryRow) return false;
            if (viewMode === 'PARTS' && item.isSummaryRow) return false;
            if (searchQuery.trim()) {
              const q = searchQuery.toLowerCase();
              return (
                item.equipment.toLowerCase().includes(q) ||
                item.description.toLowerCase().includes(q) ||
                item.sourceFile.toLowerCase().includes(q)
              );
            }
            return true;
          });
        }, [partsData, viewMode, searchQuery]);

        const totals = useMemo(() => {
          const summaryItems = partsData.filter((p) => p.isSummaryRow);
          const est = summaryItems.reduce((acc, r) => acc + r.estTotal, 0);
          const act = summaryItems.reduce((acc, r) => acc + r.actualSpent, 0);
          const partCount = partsData.filter((p) => !p.isSummaryRow).reduce((acc, r) => acc + r.qty, 0);
          return { est, act, rem: est - act, partCount };
        }, [partsData]);

        const fmt = (n) => '$' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

        if (!isHydrated) {
          return h('div', { className: 'p-8 text-slate-400' }, 'Loading saved workspace...');
        }

        return h('div', { className: 'max-w-7xl mx-auto p-6 space-y-6' },
          toast && h('div', { className: 'fixed bottom-5 right-5 z-50 bg-emerald-600 text-white px-4 py-3 rounded-xl shadow-lg text-sm font-medium' }, toast),

          // Header
          h('header', { className: 'flex flex-wrap items-center justify-between gap-4 bg-slate-900 border border-slate-800 p-5 rounded-2xl' },
            h('div', null,
              h('h1', { className: 'text-xl font-bold text-white' }, 'Repair Estimation & Cost Consolidation'),
              h('p', { className: 'text-xs text-slate-400 mt-1' }, 'Auto-saved in browser storage (' + uploadedFiles.length + ' file(s) persisted across reloads)')
            ),
            h('div', { className: 'flex flex-wrap items-center gap-2' },
              h('label', { className: 'cursor-pointer bg-amber-500 hover:bg-amber-400 text-slate-950 font-semibold px-4 py-2 rounded-xl text-sm transition' },
                '+ Upload Excel Trackers',
                h('input', { type: 'file', multiple: true, accept: '.xlsx,.xls', onChange: handleMultiExcelUpload, className: 'hidden' })
              ),
              h('button', { onClick: handleExportBackup, className: 'bg-slate-800 hover:bg-slate-700 px-3 py-2 rounded-xl text-xs font-medium' }, 'Export Backup (.json)'),
              h('label', { className: 'cursor-pointer bg-slate-800 hover:bg-slate-700 px-3 py-2 rounded-xl text-xs font-medium' },
                'Restore Backup',
                h('input', { type: 'file', accept: '.json', onChange: handleImportBackup, className: 'hidden' })
              ),
              uploadedFiles.length > 0 && h('button', { onClick: handleClearAll, className: 'bg-rose-950/70 hover:bg-rose-900 text-rose-300 border border-rose-800 px-3 py-2 rounded-xl text-xs font-medium' }, 'Remove All Sheets')
            )
          ),

          // KPI Cards
          h('section', { className: 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4' },
            h('div', { className: 'bg-slate-900 border border-slate-800 p-4 rounded-2xl' },
              h('div', { className: 'text-xs text-slate-400 uppercase' }, 'Master Est. Cost (SGD)'),
              h('div', { className: 'text-2xl font-bold text-amber-400 mt-1' }, fmt(totals.est))
            ),
            h('div', { className: 'bg-slate-900 border border-slate-800 p-4 rounded-2xl' },
              h('div', { className: 'text-xs text-slate-400 uppercase' }, 'Actual Spent (SGD)'),
              h('div', { className: 'text-2xl font-bold text-emerald-400 mt-1' }, fmt(totals.act))
            ),
            h('div', { className: 'bg-slate-900 border border-slate-800 p-4 rounded-2xl' },
              h('div', { className: 'text-xs text-slate-400 uppercase' }, 'Remaining Balance'),
              h('div', { className: 'text-2xl font-bold text-sky-400 mt-1' }, fmt(totals.rem))
            ),
            h('div', { className: 'bg-slate-900 border border-slate-800 p-4 rounded-2xl' },
              h('div', { className: 'text-xs text-slate-400 uppercase' }, 'Indexed Component Qty'),
              h('div', { className: 'text-2xl font-bold text-white mt-1' }, totals.partCount.toLocaleString())
            )
          ),

          // Audit Rows
          auditReports.length > 0 && h('section', { className: 'space-y-2' },
            auditReports.map((rep, idx) =>
              h('div', { key: idx, className: 'flex flex-wrap items-center justify-between gap-3 bg-slate-900/90 border border-slate-800 px-4 py-3 rounded-xl text-xs' },
                h('span', { className: 'font-semibold text-amber-400 uppercase' }, rep.fileName),
                h('div', { className: 'flex flex-wrap gap-3' },
                  h('span', null, 'Summary Est: ', h('strong', null, fmt(rep.summaryEst))),
                  h('span', null, 'Summary Spent: ', h('strong', { className: 'text-emerald-400' }, fmt(rep.summaryAct))),
                  h('span', null, 'Receipt Tabs Total: ', h('strong', null, fmt(rep.tabEst)))
                )
              )
            )
          ),

          // Filter Bar
          h('section', { className: 'flex flex-wrap items-center justify-between gap-3 bg-slate-900 border border-slate-800 p-4 rounded-2xl' },
            h('div', { className: 'flex gap-2' },
              h('button', {
                onClick: () => setViewMode('SUMMARY'),
                className: 'px-3 py-1.5 rounded-lg text-xs font-semibold ' + (viewMode === 'SUMMARY' ? 'bg-amber-500 text-slate-950' : 'bg-slate-800 text-slate-300')
              }, 'Repair Summary (1:1)'),
              h('button', {
                onClick: () => setViewMode('PARTS'),
                className: 'px-3 py-1.5 rounded-lg text-xs font-semibold ' + (viewMode === 'PARTS' ? 'bg-amber-500 text-slate-950' : 'bg-slate-800 text-slate-300')
              }, 'All Receipt Parts')
            ),
            h('input', {
              type: 'text',
              value: searchQuery,
              onChange: (e) => setSearchQuery(e.target.value),
              placeholder: 'Search equipment, part description, or file...',
              className: 'bg-slate-950 border border-slate-700 rounded-xl px-3 py-1.5 text-sm w-full sm:w-80 focus:outline-none focus:border-amber-500'
            })
          ),

          // Table
          h('section', { className: 'bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden' },
            h('div', { className: 'overflow-x-auto' },
              h('table', { className: 'w-full text-left text-sm' },
                h('thead', { className: 'bg-slate-950 text-slate-400 text-xs uppercase border-b border-slate-800' },
                  h('tr', null,
                    h('th', { className: 'px-4 py-3' }, 'Source File'),
                    h('th', { className: 'px-4 py-3' }, 'Equipment / Tab'),
                    h('th', { className: 'px-4 py-3' }, 'Description'),
                    h('th', { className: 'px-4 py-3 text-right' }, 'Qty'),
                    h('th', { className: 'px-4 py-3 text-right' }, 'Unit Price'),
                    h('th', { className: 'px-4 py-3 text-right' }, 'Est. Total'),
                    h('th', { className: 'px-4 py-3 text-right' }, 'Actual Spent')
                  )
                ),
                h('tbody', { className: 'divide-y divide-slate-800/70' },
                  filteredRows.length === 0
                    ? h('tr', null, h('td', { colSpan: 7, className: 'px-4 py-10 text-center text-slate-500' }, 'No records loaded. Upload your Excel trackers above to begin.'))
                    : filteredRows.map((row) =>
                        h('tr', { key: row.id, className: 'hover:bg-slate-800/40' },
                          h('td', { className: 'px-4 py-3 text-xs text-slate-400' }, row.sourceFile),
                          h('td', { className: 'px-4 py-3 font-medium text-white' }, row.equipment),
                          h('td', { className: 'px-4 py-3 text-slate-300' }, row.description),
                          h('td', { className: 'px-4 py-3 text-right' }, row.qty),
                          h('td', { className: 'px-4 py-3 text-right' }, fmt(row.unitPrice)),
                          h('td', { className: 'px-4 py-3 text-right font-semibold text-amber-400' }, fmt(row.estTotal)),
                          h('td', { className: 'px-4 py-3 text-right text-emerald-400' }, fmt(row.actualSpent))
                        )
                      )
                )
              )
            )
          )
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(h(App));
    })();
  </script>
</body>
</html>
